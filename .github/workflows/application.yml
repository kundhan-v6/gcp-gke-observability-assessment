name: Application Build Publish and Deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'kubernetes/**'
      - '.github/workflows/application.yml'

  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'kubernetes/**'
      - '.github/workflows/application.yml'

  workflow_dispatch:
    inputs:
      deployment:
        description: 'Build only, or manually deploy the selected feature branch'
        required: true
        default: build
        type: choice
        options:
          - build
          - deploy
      confirm_shared_project:
        description: 'For feature-branch deploy, enter DEPLOY_SHARED_PROJECT'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gcp-gke-assessment
  REGISTRY_HOST: us-docker.pkg.dev
  REPOSITORY: gke-apps

jobs:
  build-publish-deploy:
    name: Build Publish and Deploy Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate manual branch deploy request
        if: github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy'
        working-directory: .
        env:
          CONFIRM_SHARED_PROJECT: ${{ inputs.confirm_shared_project }}
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "Manual deploy from main is disabled. Main deploys after merge on push." >&2
            exit 1
          fi

          if [[ "${CONFIRM_SHARED_PROJECT}" != "DEPLOY_SHARED_PROJECT" ]]; then
            echo "Explicit shared-project confirmation is required." >&2
            exit 1
          fi

          git fetch origin main

          git merge-base --is-ancestor origin/main HEAD || {
            echo "Branch must include current main before deploying to the shared assessment project." >&2
            exit 1
          }

      - name: Build App A
        run: |
          docker build \
            -t app-a:test \
            ./apps/app-a

      - name: Build App B
        run: |
          docker build \
            -t app-b:test \
            ./apps/app-b

      - name: Authenticate to Google Cloud
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy')
        uses: google-github-actions/auth@v3
        with:
          project_id: gcp-gke-assessment
          workload_identity_provider: projects/154908148121/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: github-terraform@gcp-gke-assessment.iam.gserviceaccount.com

      - name: Setup Google Cloud CLI
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy')
        uses: google-github-actions/setup-gcloud@v3

      - name: Install kubectl
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy')
        run: |
          gcloud components install kubectl --quiet
          kubectl version --client

      - name: Configure Docker Authentication
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy')
        run: |
          gcloud auth configure-docker ${REGISTRY_HOST} --quiet

      - name: Tag Application Images
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy')
        run: |
          APP_A_IMAGE="${REGISTRY_HOST}/${PROJECT_ID}/${REPOSITORY}/app-a"
          APP_B_IMAGE="${REGISTRY_HOST}/${PROJECT_ID}/${REPOSITORY}/app-b"

          docker tag app-a:test "${APP_A_IMAGE}:${GITHUB_SHA}"
          docker tag app-a:test "${APP_A_IMAGE}:latest"

          docker tag app-b:test "${APP_B_IMAGE}:${GITHUB_SHA}"
          docker tag app-b:test "${APP_B_IMAGE}:latest"

      - name: Push App A
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy')
        run: |
          APP_A_IMAGE="${REGISTRY_HOST}/${PROJECT_ID}/${REPOSITORY}/app-a"

          docker push "${APP_A_IMAGE}:${GITHUB_SHA}"
          docker push "${APP_A_IMAGE}:latest"

      - name: Push App B
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy')
        run: |
          APP_B_IMAGE="${REGISTRY_HOST}/${PROJECT_ID}/${REPOSITORY}/app-b"

          docker push "${APP_B_IMAGE}:${GITHUB_SHA}"
          docker push "${APP_B_IMAGE}:latest"

      - name: Get Primary GKE Credentials
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy')
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: gcp-gke-assessment
          cluster_name: gke-primary
          location: us-central1-a

      - name: Deploy to Primary Cluster
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy')
        env:
          DEMO_SECRET: ${{ secrets.APP_DEMO_SECRET }}
        run: |
          kubectl create namespace assessment \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl -n assessment create secret generic app-secrets \
            --from-literal=DEMO_SECRET="${DEMO_SECRET}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          APP_A_IMAGE="${REGISTRY_HOST}/${PROJECT_ID}/${REPOSITORY}/app-a:${GITHUB_SHA}"
          APP_B_IMAGE="${REGISTRY_HOST}/${PROJECT_ID}/${REPOSITORY}/app-b:${GITHUB_SHA}"

          sed \
            -e "s|__APP_A_IMAGE__|${APP_A_IMAGE}|g" \
            -e "s|__APP_B_IMAGE__|${APP_B_IMAGE}|g" \
            kubernetes/apps.yaml | kubectl apply -f -

          kubectl -n assessment rollout status deployment/app-a --timeout=180s
          kubectl -n assessment rollout status deployment/app-b --timeout=180s

          kubectl -n assessment get pods
          kubectl -n assessment get services

      - name: Get Secondary GKE Credentials
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy')
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: gcp-gke-assessment
          cluster_name: gke-secondary
          location: us-east1-b

      - name: Deploy to Secondary Cluster
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy')
        env:
          DEMO_SECRET: ${{ secrets.APP_DEMO_SECRET }}
        run: |
          kubectl create namespace assessment \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl -n assessment create secret generic app-secrets \
            --from-literal=DEMO_SECRET="${DEMO_SECRET}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          APP_A_IMAGE="${REGISTRY_HOST}/${PROJECT_ID}/${REPOSITORY}/app-a:${GITHUB_SHA}"
          APP_B_IMAGE="${REGISTRY_HOST}/${PROJECT_ID}/${REPOSITORY}/app-b:${GITHUB_SHA}"

          sed \
            -e "s|__APP_A_IMAGE__|${APP_A_IMAGE}|g" \
            -e "s|__APP_B_IMAGE__|${APP_B_IMAGE}|g" \
            kubernetes/apps.yaml | kubectl apply -f -

          kubectl -n assessment rollout status deployment/app-a --timeout=180s
          kubectl -n assessment rollout status deployment/app-b --timeout=180s

          kubectl -n assessment get pods
          kubectl -n assessment get services


      - name: Get Primary GKE Credentials for Multi Cluster Ingress
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy')
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: gcp-gke-assessment
          cluster_name: gke-primary
          location: us-central1-a

      - name: Deploy Multi Cluster Services and Ingress
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'deploy')
        run: |
          kubectl apply -f kubernetes/frontend-config.yaml
          kubectl apply -f kubernetes/multicluster-ingress.yaml

          kubectl -n assessment get frontendconfig
          kubectl -n assessment get multiclusterservices
          kubectl -n assessment get multiclusteringress
