name: Terraform Infrastructure Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

  workflow_dispatch:
    inputs:
      deployment:
        description: 'Plan only, or manually apply the selected feature branch to the shared assessment project'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      confirm_shared_project:
        description: 'For branch apply, enter APPLY_SHARED_PROJECT (same GCP project and Terraform state as main)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

env:
  PROJECT_ID: gcp-gke-assessment
  TF_VERSION: 1.16.3
  TF_WORKING_DIR: terraform

jobs:
  terraform:
    name: Terraform Validate Plan Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate manual branch apply request
        if: github.event_name == 'workflow_dispatch' && inputs.deployment == 'apply'
        working-directory: .
        env:
          CONFIRM_SHARED_PROJECT: ${{ inputs.confirm_shared_project }}
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "Manual apply from main is disabled. Main applies after merge on push." >&2
            exit 1
          fi

          if [[ "${CONFIRM_SHARED_PROJECT}" != "APPLY_SHARED_PROJECT" ]]; then
            echo "Explicit shared-project confirmation is required for branch apply." >&2
            exit 1
          fi

          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "Branch must include current main before applying to the shared state." >&2
            exit 1
          }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: gcp-gke-assessment
          workload_identity_provider: projects/154908148121/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: github-terraform@gcp-gke-assessment.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Reject destructive Terraform plan
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'apply')
        run: |
          terraform show -json tfplan | jq -e '
            [.resource_changes[]? | select(.change.actions | index("delete"))] | length == 0
          ' || {
            echo "Plan contains deletion or replacement. Apply is blocked; review manually." >&2
            exit 1
          }

      - name: Terraform Apply on main after merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false tfplan

      - name: Terraform Apply on explicitly approved branch
        if: |
          github.event_name == 'workflow_dispatch' &&
          inputs.deployment == 'apply' &&
          github.ref != 'refs/heads/main'
        run: terraform apply -input=false tfplan
