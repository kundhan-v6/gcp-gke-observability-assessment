apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: app-secrets-gke
  namespace: assessment
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/gcp-gke-assessment/secrets/assessment-runtime-secret/versions/latest"
        path: "DEMO_SECRET"
